<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://sxwsoslpymbfwotvtrgl.supabase.co; script-src 'self' https://esm.sh; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
    <title>TaskBloom authorization</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; color: #25231f; }
      main { width: min(34rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; border: 1px solid #d8d0c2; border-radius: 1rem; background: #fffdf8; box-shadow: 0 1rem 3rem #25231f18; }
      h1 { margin-top: 0; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: .75rem 1rem; overflow-wrap: anywhere; }
      dt { font-weight: 700; }
      dd { margin: 0; }
      .actions { display: flex; gap: .75rem; margin-top: 1.5rem; }
      button { cursor: pointer; border: 0; border-radius: .6rem; padding: .7rem 1rem; font: inherit; }
      #approve { background: #2f6f55; color: white; }
      #deny { background: #e4ddd1; color: #25231f; }
      #email-form { display: grid; gap: .5rem; margin-top: 1rem; }
      #email-form[hidden] { display: none; }
      #email-form label { font-weight: 700; }
      #email-form input { box-sizing: border-box; width: 100%; border: 1px solid #b9b1a5; border-radius: .6rem; padding: .7rem; font: inherit; }
      #email-submit { background: #2f6f55; color: white; }
      #email-toggle { background: transparent; color: #2f6f55; padding-left: 0; text-decoration: underline; }
      #status { min-height: 1.5rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1b19; color: #f4f1ea; }
        main { border-color: #4b463e; background: #292722; }
        #deny { background: #4b463e; color: #f4f1ea; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TaskBloom authorization</h1>
      <p id="status" role="status">Checking your sign-in…</p>
      <section id="details" hidden></section>
      <div id="actions" class="actions"></div>
      <form id="email-form" hidden>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="email-submit" type="submit">Sign in with email</button>
      </form>
    </main>
        <script type="module" src="./consent.js"></script>
  </body>
</html>
